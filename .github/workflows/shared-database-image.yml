name: Shared database test image

on:
  push:
    branches: [feat/shared-jpa-database]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    uses: ./.github/workflows/go-test.yml

  image:
    needs: regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./pkg/...
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server
          push: true
          tags: quay.io/massbank/massbank-api:test-shared-jpa-${{ github.sha }}

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - run: npm ci && npm run compile && npx --no-install vitest run
        working-directory: web-frontend
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web-frontend
          file: ./web-frontend/Dockerfile-frontend
          push: true
          tags: quay.io/massbank/massbank-frontend:test-shared-jpa-${{ github.sha }}
